// turn a bone about a world axis by deg (after the clip has posed it)

  const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(...axis).normalize(), rad(deg));

  bone.quaternion.copy(pq.invert().multiply(q.multiply(wq)));

// turn `bone` so its child lies toward the world point `target`
function aim(bone, child, target) {

  const bp = bone.getWorldPosition(V()), cp = child.getWorldPosition(V());

    fa.updateMatrixWorld(true);

    const len = 0.1;
    const cur = fa.localToWorld(new THREE.Vector3(0, len, 0));
