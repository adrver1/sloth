<!-- Summit Cabin: the camp's second place, a winter mountaintop with a log cabin, a scout camp and a fire lookout, walked in first person.
     Near and far are one world: clipmap terrain rings round you to 1 km, a painted backdrop beyond, a painted horizon at 22 km, and a
     distance haze instead of fog. The code is in summit/: summit/main.js is the entry and runs the frame; the other modules build their
     part when imported (land first, then the view, terrain, trees, cabin, scout camp, road and jeep, map and compass, effects, light, walking).
     URL options: ?ero=off (the land before erosion), ?bare=1 (the land alone). -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="camp-models" content="base64">   <!-- the Pages deploy sets binary, as for camp.html (bakedlight.js fetchBytes) -->
<title>Summit Cabin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A walkable winter mountaintop with a cabin, a scout camp and a lookout tower: a test of long views where near and far are one world.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="camp/hud.css">   <!-- the camp's HUD, shared (Adriaen 2026-11-15): the ⚙️ bar, the stick, the hint, the fps pill -->
<style>
[hidden] { display: none !important; }
:root { color-scheme: light; --bubble-ink: #3a2a20; }   /* his speech bubble (camp/operator/talk.js): dark words on its cream */
html, body { height: 100%; margin: 0; }
body { background: #0b1220; color: var(--ink); font-family: var(--display); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
body.debug .bar { top: calc(84px + env(safe-area-inset-top, 0px)); }   /* ?debug=1: under the three lines of the fps pill */
/* the summit's own buttons in the camp's ⚙️ menu: the weather, and with ?debug=1 the prototype's tools in a cream card */
#dev { pointer-events: auto; background: rgb(255 248 238 / .94); border-radius: 18px; padding: 10px 12px; box-shadow: 0 3px 0 rgb(138 90 59 / .2); font-size: 13px; color: var(--soft);
  width: min(340px, calc(100vw - 32px)); max-height: 50vh; overflow: auto; display: grid; gap: 8px; justify-items: end; }
#dev .lbl { justify-self: start; font-weight: 600; }
#dev .checks { justify-self: start; display: flex; flex-wrap: wrap; gap: 6px 16px; }
#dev .checks label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
#dev table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
#dev td { padding: 2px 0; border-top: 1px solid rgb(138 90 59 / .15); } #dev td:last-child { text-align: right; color: var(--ink); }
</style>
</head>
<body>

<div id="stage"></div>
<div class="hud"><div id="perf" hidden>…</div></div>   <!-- ?debug=1: the fps, draws and triangles (main.js) -->
<div id="q">Stick to walk · drag to look<br>Tap a sloth, or anything that lights up, to see what you can do</div>
<div class="stick" id="stick" hidden><i></i></div>
<div class="bar">
  <button id="menu" aria-label="Settings" aria-expanded="false">⚙️</button>
  <div class="menu" id="opts" hidden>
    <label class="time">🕐 <input type="range" id="hour" min="0" max="24" step="0.05" value="15.5" aria-label="Time of day"><span id="hourOut">15:30</span></label>
    <div class="row" id="weather" role="group" aria-label="Weather"><button data-w="clear" aria-pressed="true">☀️ Clear</button><button data-w="valley" aria-pressed="false">🌫 Valley fog</button><button data-w="storm" aria-pressed="false">❄️ Snowstorm</button></div>
    <button id="sound">Sound: All</button>
    <div id="dev" hidden>   <!-- ?debug=1: the prototype's jumps, tests, walking speeds and triangle table (Adriaen 2026-11-15 Q16: they go from the game) -->
      <div class="row" id="jump" role="group" aria-label="Jump to a place"><button data-p="porch" aria-pressed="false">Porch</button><button data-p="camp" aria-pressed="false">Camp</button><button data-p="tower" aria-pressed="false">Lookout</button></div>
      <div class="row" id="speeds"></div>
      <div class="row"><button id="speedBtn">⏱ Speed test (20 s, stand still)</button><button id="walkBtn">🏃 Walk test (12 s)</button></div>
      <pre id="speed" hidden style="margin:0;font:12px ui-monospace,monospace;white-space:pre-wrap;user-select:text;justify-self:stretch"></pre>
      <span class="lbl">How it's done</span>
      <div class="checks"><label><input id="hazeOn" type="checkbox" checked> Distance haze</label><label><input id="wire" type="checkbox"> Terrain wireframe</label></div>
      <table id="tris"></table>
    </div>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script type="module" src="summit/main.js"></script>
</body>
</html>
