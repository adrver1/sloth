     Ground level only for now (the boardwalk was dropped on 2026-11-11): you walk the round clearing, the forest edge stops you.
     First person. On a phone a stick bottom-left walks (as in desk-at-night's free mode) and a drag anywhere else looks; on a computer WASD or the arrow keys walk and a mouse drag looks. Tap a sloth to boop it, hold on it to feed it. Rest turns the light to dusk.
     Built on index.html (the forest look prototype): same three looks behind #moss | #paint | #low, and the same detail toggle.
     Detail button (Low / Medium / High, or ?detail=) scales leaves, ferns, fur shells, effects and resolution.
     No real-time shadows; "baked" light is vertex colour; leaves and plants are instanced (one draw per kind). -->
