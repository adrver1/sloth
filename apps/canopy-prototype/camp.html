<!-- PROTOTYPE (throwaway): Canopy Camp. Question: does a cozy clearing in a lush forest, walked on foot, feel good to explore while staying cheap to render?
     Ground level only for now (the boardwalk was dropped on 2026-11-11): you walk the round clearing, the forest edge stops you.
     First person. On a phone a stick bottom-left walks (as in desk-at-night's free mode) and a drag anywhere else looks; on a computer WASD or the arrow keys walk and a mouse drag looks. Tap a sloth to boop it, hold on it to feed it. Rest turns the light to dusk.
     Built on index.html (the forest look prototype): same three looks behind #moss | #paint | #low, and the same detail toggle.
     Detail button (Low / Medium / High, or ?detail=) scales leaves, ferns, fur shells, effects and resolution.
     No real-time shadows; "baked" light is vertex colour; leaves and plants are instanced (one draw per kind). -->
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Canopy Camp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root { --cream: #fff8ee; --ink: #4a3426; --soft: #8a6a55; --pink: #ff7fa8; --leaf: #6dbb5a;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif; color-scheme: light; }
html, body { height: 100%; margin: 0; }
body { background: #6f8f6a; color: var(--ink); font-family: var(--display); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: fixed; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.pill { background: rgb(255 248 238 / .9); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 20px; box-shadow: 0 3px 0 rgb(138 90 59 / .18); font-variant-numeric: tabular-nums; }
#perf { font-size: 12px; font-weight: 500; padding: 5px 10px; color: var(--soft); text-align: right; line-height: 1.25; border-radius: 14px; }
.bar { position: fixed; left: 0; right: 0; top: calc(54px + env(safe-area-inset-top, 0px)); display: flex; justify-content: center; gap: 6px; flex-wrap: wrap;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.bar a, .bar button { pointer-events: auto; font: 600 13px var(--display); color: var(--ink); background: rgb(255 248 238 / .85); border: 0; border-radius: 999px;
  padding: 6px 11px; text-decoration: none; box-shadow: 0 2px 0 rgb(138 90 59 / .2); cursor: pointer; }
.stick { position: fixed; left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(28px + env(safe-area-inset-bottom, 0px)); width: 120px; height: 120px; border-radius: 50%;
  background: rgb(255 248 238 / .18); border: 2px solid rgb(255 248 238 / .55); touch-action: none; }
.stick i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgb(255 248 238 / .85); box-shadow: 0 3px 0 rgb(138 90 59 / .25); }
.stick i::after { content: "🐾"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 20px; opacity: .7; }
.bar a.on { background: var(--pink); color: #fff; box-shadow: 0 3px 0 #d95c86; }
.bar button { background: #ffe9a8; }
#toast { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%) scale(.6); opacity: 0; transition: .35s; pointer-events: none;
  font-weight: 700; font-size: 34px; color: #fff; text-shadow: 0 3px 0 #d95c86, 0 0 18px rgb(255 127 168 / .7); white-space: nowrap; }
#toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.bar { justify-content: flex-end; }
.bar .menu { flex-basis: 100%; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.bar .menu[hidden] { display: none; }
.bar .time { pointer-events: auto; display: flex; align-items: center; gap: 8px; font: 600 13px var(--display); background: rgb(255 248 238 / .85); border-radius: 999px; padding: 4px 12px; box-shadow: 0 2px 0 rgb(138 90 59 / .2); }
.bar .time input { width: 150px; accent-color: var(--pink); }
.bar .time span { min-width: 3em; font-variant-numeric: tabular-nums; }
/* the hint sits low on the left (above the stick on a phone), clear of the fire in the middle of the view */
#q { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); max-width: min(330px, calc(100% - 32px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transition: opacity 1s; text-align: left; font-size: 13px; line-height: 1.35; color: #fff; text-shadow: 0 1px 3px rgb(0 0 0 / .55); pointer-events: none; }
body.touch #q { bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
/* the loading card, shown until every model is in and the shaders are compiled */
#load { position: fixed; inset: 0; display: grid; place-items: center; background: #6f8f6a; transition: opacity .6s; z-index: 5; }
#load.done { opacity: 0; pointer-events: none; }
#load .card { background: var(--cream); border-radius: 24px; padding: 22px 28px; text-align: center; box-shadow: 0 4px 0 rgb(138 90 59 / .25); width: min(260px, calc(100vw - 64px)); }
#load .card b { display: block; font-size: 40px; margin-bottom: 6px; }
#load .card span { font-weight: 600; font-size: 16px; }
#load .bar2 { height: 8px; border-radius: 99px; background: #f0e2cf; margin-top: 14px; overflow: hidden; }
#load .bar2 i { display: block; height: 100%; width: 4%; background: var(--leaf); border-radius: 99px; transition: width .3s; }
</style>
<canvas id="c"></canvas>
<div class="hud"><div class="pill" id="score">💗 0 friends</div><div class="pill" id="perf">… fps</div></div>
<div id="q">Stick to walk · drag to look<br>Tap a sloth, or anything that lights up, to see what you can do</div>
<div class="stick" id="stick" hidden><i></i></div>
<div id="toast"></div>
<div id="load"><div class="card"><b>🦥</b><span>Getting the camp ready…</span><div class="bar2"><i id="loadbar"></i></div></div></div>
<div class="bar">
  <button id="menu" aria-label="Settings" aria-expanded="false">⚙️</button>
  <div class="menu" id="opts" hidden><label class="time">🕐 <input type="range" id="time" min="0" max="23.75" step="0.25" aria-label="Time of day"><span id="clock">12:00</span></label><button id="cycle">Day cycle: off</button><button id="detail">Detail: Medium</button><button id="lm">Light</button></div>
</div>
