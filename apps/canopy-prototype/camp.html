<!-- Canopy Camp: a cozy clearing in a lush forest with the baby sloths, the bearded operator and a jeep, walked on foot in first person.
     You walk the round clearing, the footpath to the sloth tree's glade and the first stretch of the jeep's track; the forest edge stops you.
     On a phone a stick bottom-left walks (as in desk-at-night's free mode), a drag anywhere else looks and two fingers zoom; on a computer WASD or the arrow keys walk, a mouse drag looks and the wheel zooms.
     What you can use lights up when you look at it from close by: a log seat, a jeep door, a clock, the radio, the wood pile, the fire. A tap on it opens a small menu of what you can do. A tap on a sloth opens its menu too, and a hold on a sloth feeds it.
     The ⚙️ button opens the settings: the time of day and the day cycle, the weather and the sound; with ?dev also detail (Low / Medium / High: leaves, ferns, fur shells, effects and resolution), the light maps (2K / 1K), the move lab and the fps pill (core.js OPT.dev, review R2-206).
     Light: the props and the ground carry baked light maps (props/bake_all.py), mixed by the hour; the one live light with a shadow is the jeep's cabin light. Leaves and plants are instanced (one draw per kind).
     The code is in camp/: camp/main.js is the entry and builds the parts in the order of its build list. The URL options (?detail=, ?time=, ?weather= and more) are listed at the top of camp/core.js, the window.__ names the tools use in camp/debug.js. -->
<meta charset="utf-8">
<meta name="camp-models" content="base64"><!-- the Pages deploy sets "binary" (bakedlight.js fetchBytes, review R2-214) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Canopy Camp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="camp/hud.css">   <!-- the HUD both levels share: the ⚙️ bar, the stick, the hint, the fps pill -->
<style>
:root { --cream: #fff8ee; --ink: #4a3426; --soft: #8a6a55; --pink: #ff7fa8; --leaf: #6dbb5a;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif; color-scheme: light; }
html, body { height: 100%; margin: 0; }
body { background: #6f8f6a; color: var(--ink); font-family: var(--display); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
/* the loading card, shown until every model is in and the shaders are compiled */
#load { position: fixed; inset: 0; display: grid; place-items: center; background: #6f8f6a; transition: opacity .6s; z-index: 5; }
#load.done { opacity: 0; pointer-events: none; }
#load .card { background: var(--cream); border-radius: 24px; padding: 22px 28px; text-align: center; box-shadow: 0 4px 0 rgb(138 90 59 / .25); width: min(260px, calc(100vw - 64px)); }
#load .card b { display: block; font-size: 40px; margin-bottom: 6px; }
#load .card span { font-weight: 600; font-size: 16px; }
#load .bar2 { height: 8px; border-radius: 99px; background: #f0e2cf; margin-top: 14px; overflow: hidden; }
#load .bar2 i { display: block; height: 100%; width: 4%; background: var(--leaf); border-radius: 99px; transition: width .3s; }
</style>
<canvas id="c"></canvas>
<div class="hud"><div id="perf" hidden>… fps</div></div>
<div id="q">Stick to walk · drag to look<br>Tap a sloth, or anything that lights up, to see what you can do</div>
<div class="stick" id="stick" hidden><i></i></div>
<div id="load"><div class="card"><b>🦥</b><span>Getting the camp ready…</span><div class="bar2"><i id="loadbar"></i></div></div></div>
<div class="bar">
  <button id="menu" aria-label="Settings" aria-expanded="false">⚙️</button>
  <div class="menu" id="opts" hidden><label class="time">🕐 <input type="range" id="time" min="0" max="23.75" step="0.25" aria-label="Time of day"><span id="clock">12:00</span></label><button id="cycle">Day cycle: off</button><button id="weather">Weather</button><button id="detail" hidden>Detail: Medium</button><button id="lm" hidden>Light</button><button id="sound">Sound: All 🔊</button></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<!-- the camp's code is in camp/ (camp review M2), one module per part, each saying in its first lines what it does. camp/main.js
     is the entry: its build list sets the order the parts are built in. -->
<!-- if the camp fails while the loading card is up (a download that fails, an error while building), the card says so and
     a tap reloads (review R2-058). Errors from images are left out: a missing baked map is allowed and falls back. -->
<script>
{   // a block, so loadFailed is not a window global (CODING-STANDARDS section 3)
  const loadFailed = () => {
    const card = document.getElementById("load");
    if (!card || card.classList.contains("done") || card.dataset.failed) return;
    card.dataset.failed = "1"; card.querySelector("span").textContent = "That didn't load. Tap to try again";
    card.style.cursor = "pointer"; card.onclick = () => location.reload();
  };
  addEventListener("error", (e) => { if (!(e.target instanceof Element) || e.target.tagName === "SCRIPT") loadFailed(); }, true);
  addEventListener("unhandledrejection", () => loadFailed());
}
</script>
<script type="module" src="camp/main.js"></script>
