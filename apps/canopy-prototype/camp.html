<!-- PROTOTYPE (throwaway): Canopy Camp. Question: does a cozy clearing in a lush forest, walked on foot, feel good to explore while staying cheap to render?
     Ground level only for now (the boardwalk was dropped on 2026-11-11): you walk the round clearing, the forest edge stops you.
     First person. On a phone a stick bottom-left walks (as in desk-at-night's free mode) and a drag anywhere else looks; on a computer WASD or the arrow keys walk and a mouse drag looks. Tap a sloth to boop it, hold on it to feed it. Rest turns the light to dusk.
     Built on index.html (the forest look prototype): same three looks behind #moss | #paint | #low, and the same detail toggle.
     Detail button (Low / Medium / High, or ?detail=) scales leaves, ferns, fur shells, effects and resolution.
     No real-time shadows; "baked" light is vertex colour; leaves and plants are instanced (one draw per kind). -->

  const dx = e.clientX - L.x, dy = e.clientY - L.y; L.x = e.clientX; L.y = e.clientY; L.moved += Math.hypot(dx, dy);
  if (looks.size === 2) { const [a, b] = [...looks.values()]; fovAdd = THREE.MathUtils.clamp(fov0 + (pinch0 - Math.hypot(a.x - b.x, a.y - b.y)) * 0.06, -20, 6); resize(); return; }
  me.yaw -= dx * 0.005; me.pitch = THREE.MathUtils.clamp(me.pitch - dy * 0.004, -1.2, 1.2); me.lastDrag = uTime.value;
});
const lookEnd = (e) => {
  const L = looks.get(e.pointerId); looks.delete(e.pointerId); if (!L) return; clearTimeout(L.holdT);
  if (L.moved < 12 && !L.held && performance.now() - L.t0 < 450) tap(e.clientX, e.clientY);
};
$("c").addEventListener("pointerup", lookEnd); $("c").addEventListener("pointercancel", (e) => { const L = looks.get(e.pointerId); if (L) clearTimeout(L.holdT); looks.delete(e.pointerId); });
addEventListener("wheel", (e) => { fovAdd = THREE.MathUtils.clamp(fovAdd + e.deltaY * 0.02, -20, 6); resize(); }, { passive: true });

  if (h.distance < 7) boop(h.object.userData.s); else toast("Get a bit closer");

const BOOP = ["eep!", "hehe", "*slow blink*", "boop", "mmh?", "*yawn*"];

let friends = 0;

  const f = sprite("🌺", 96); f.position.copy(camera.position).add(V(0.15, -0.35, -0.6).applyQuaternion(camera.quaternion)); scene.add(f);
  fx.push({ s: f, fly: { from: f.position.clone(), to: s.p.clone().add(V(0, -0.15, 0)) }, t: 0, life: 0.9, done() {
    s.nod = 2.4; burst(s.p.clone().add(V(0, 0.2, 0)), "💗", 5, 1.6, 80);
    if (!s.friend) { s.friend = true; friends++; flowerCrown(s); $("score").textContent = `💗 ${friends} friend${friends > 1 ? "s" : ""}`; toast(friends === COUNT ? "Everyone's your friend! 🌸" : "New friend! 🌸"); }
    else burst(s.p.clone().add(V(0, 0.45, 0)), "nom nom", 1, 1.4, 60);

}

// rest: dusk falls, the lanterns and the fire glow brighter, fireflies come out
const hemiL = scene.children.find((o) => o.isHemisphereLight);
const DAY = { fog: new THREE.Color(S.fog[0]), hemi: hemiL.intensity, sun: sun.intensity }, DUSK = new THREE.Color(0x34405a);
let dusk = 0, duskTo = 0;
const flies = (() => {
  const n = 120, p = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const a = R(0, 6.28), r = R(2, RC + 6); p.set([Math.cos(a) * r, R(0.4, 7), Math.sin(a) * r], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({ map: glowTex, color: 0xd8ff7a, size: 0.14, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, fog: false })); scene.add(pts); return pts;
})();
$("rest").onclick = () => { duskTo = duskTo ? 0 : 1; $("rest").textContent = duskTo ? "Wake up ☀️" : "Rest 🌙"; };

// ================================================================ loop, with an fps panel and a resolution safety net
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = (camera.aspect < 0.8 ? 70 : 58) + fovAdd; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
camera.far = 80;
if (qs.has("yaw")) me.yaw = +qs.get("yaw"); if (qs.has("pitch")) me.pitch = +qs.get("pitch");
const clock = new THREE.Clock(); let frames = 0, acc = 0, slow = 0;
window.__stats = {};
renderer.setAnimationLoop(() => {
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05); uTime.value += dt;
  step(dt);
  for (const s of sloths) {
    s.mixer.update(dt);
    if (s.squish > 0) { s.squish = Math.max(0, s.squish - dt * 1.4); const k = Math.sin(s.squish * Math.PI * 3) * s.squish * 0.18; s.o.scale.set(SL * (1 + k), SL * (1 - k), SL * (1 + k)); }
    if (s.nod > 0) { s.nod = Math.max(0, s.nod - dt); s.head.rotation.x += Math.sin(s.nod * 9) * 0.25 * Math.min(1, s.nod); }
  }
  for (let i = fx.length - 1; i >= 0; i--) {

    if (f.fly) { const e = Math.min(1, f.t / f.life), k = e * e * (3 - 2 * e); f.s.position.lerpVectors(f.fly.from, f.fly.to, k); f.s.position.y += Math.sin(k * Math.PI) * 0.4; }
    else { f.s.position.addScaledVector(f.v, dt); f.v.multiplyScalar(0.96); f.s.material.opacity = 1 - f.t / f.life; }
    if (f.t > f.life) { scene.remove(f.s); fx.splice(i, 1); f.done?.(); }
  }
  const fl = 0.85 + 0.15 * Math.sin(uTime.value * 13) * Math.sin(uTime.value * 7.3);
  flames.forEach((s, i) => { s.scale.setScalar((0.9 - i * 0.2) * fl * (1 + 0.3 * dusk)); s.position.y = 0.45 + i * 0.14 + Math.sin(uTime.value * (5 + i)) * 0.03; });
  fireLight.intensity = (D.fx ? 6 : 0) * fl * (1 + 1.5 * dusk);
  lanterns.forEach((s, i) => { s.material.opacity = 0.45 + 0.5 * dusk; s.position.y = lanternGlow[i].y + Math.sin(uTime.value * 1.2 + i) * 0.015; });
  dusk += Math.sign(duskTo - dusk) * Math.min(Math.abs(duskTo - dusk), dt * 0.25);
  if (dusk || duskTo) {
    scene.fog.color.copy(DAY.fog).lerp(DUSK, dusk); hemiL.intensity = DAY.hemi * (1 - 0.6 * dusk); sun.intensity = DAY.sun * (1 - 0.85 * dusk);
    sky.material.color.setScalar(1 - 0.65 * dusk); flies.material.opacity = dusk; flies.rotation.y += dt * 0.02;
    if (typeof rayMat !== "undefined") rayMat.opacity = S.rays * (1 - dusk);
  }
  if (motes) motes.rotation.y += dt * 0.02;
  renderer.render(scene, camera);
  frames++; acc += raw;
  if (acc >= 1) {
    const fps = frames / acc, i = renderer.info.render;
    slow = fps < 45 ? slow + 1 : 0;
    if (slow >= 2 && pr > 1) { pr = Math.max(1, pr - 0.25); renderer.setPixelRatio(pr); resize(); slow = 0; }
    Object.assign(window.__stats, { fps: Math.round(fps), calls: i.calls, tris: i.triangles, pr, detail: DETAIL });
    $("perf").innerHTML = `${Math.round(fps)} fps<br>${i.calls} draws · ${(i.triangles / 1000).toFixed(0)}k tris`;
    frames = 0; acc = 0;
  }
});
window.__me = me; window.__boop = (i) => boop(sloths[i]); window.__feed = (i) => feed(sloths[i]); window.__rest = () => { duskTo = 1; dusk = 1; };
window.__face = (i) => { const s = sloths[i]; const flat = V(s.p.x, 0, s.p.z); me.pos.copy(flat.clone().multiplyScalar(Math.max(0, 1 - 2.2 / flat.length()))); collide(me.pos); step(0); const d = s.p.clone().add(V(0, -0.2, 0)).sub(camera.position); me.yaw = Math.atan2(-d.x, -d.z); me.pitch = Math.atan2(d.y, Math.hypot(d.x, d.z)); me.lastDrag = 1e9; };
window.__stick = (x, y) => stickV.set(x, y);
