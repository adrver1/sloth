     Detail button (Low / Medium / High, or ?detail=) scales leaves, ferns, fur shells, effects and resolution.

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script type="module">

const qs = new URLSearchParams(location.search);

// seeded random, so all three looks grow the same tree and hide sloths in the same spots

const S = {

           leaf: [0x4f7f34, 0x6b9a3c, 0x3d6a2f, 0x85a845], hemi: [0xf4f0dc, 0x3b4a2a, 1.6], sun: [0xffe7c0, 2.0], rays: 0.22, motes: 260, flat: false, slothTint: 0xc9d9a6 },
  paint: { sky: ["#fde8cf", "#cfe6c4", "#8fb889"], fog: [0xcfe0c0, 0.045], bark: [0x9a6b4c, 0x6e4a36], moss: 0x9cc46a, mossAmt: 0.45,
           leaf: [0x7cc06a, 0x9bd27a, 0x5fae63, 0xb7dd85], hemi: [0xfff6e6, 0x6e8f62, 2.0], sun: [0xffe2b8, 1.6], rays: 0.16, motes: 160, flat: false, slothTint: 0xe2ecc4 },
  low:   { sky: ["#bfeaff", "#d9f5e8", "#a8dca0"], fog: [0xc8eedd, 0.032], bark: [0x9b6440, 0x7a4b30], moss: 0x8bcf5a, mossAmt: 0.35,
           leaf: [0x5cc45a, 0x7fd860, 0x45b35a, 0xa3e36a], hemi: [0xffffff, 0x7fb070, 2.2], sun: [0xfff3dc, 1.5], rays: 0, motes: 0, flat: true, slothTint: 0xdaf0c0 },

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ canvas: $("c"), antialias: D.aa, powerPreference: "high-performance" });
let pr = Math.min(devicePixelRatio, D.pr);
renderer.setPixelRatio(pr);

const scene = new THREE.Scene();

scene.add(new THREE.HemisphereLight(S.hemi[0], S.hemi[1], S.hemi[2]));

const uTime = { value: 0 };

    sh.uniforms.uTime = uTime;

        #ifdef USE_INSTANCING

        float w = sin(uTime * 1.4 + ip.x * 1.7 + ip.z * 1.3) + 0.5 * sin(uTime * 2.3 + ip.y * 2.1);

// ---------------------------------------------------------------- backdrop: painted forest layers in the mist (no geometry behind them)
const back = canvasTex(1024, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); S.sky.forEach((c, i) => gr.addColorStop(i / (S.sky.length - 1), c)); g.fillStyle = gr; g.fillRect(0, 0, w, h);

  for (let l = 0; l < layers; l++) {
    const col = new THREE.Color(S.fog[0]).lerp(new THREE.Color(S.leaf[2]), 0.25 + l * 0.22);
    g.fillStyle = col.getStyle();
    for (let x = -20; x < w + 20; x += R(22, 46)) {

      g.fillRect(x + 8, top, LOOK === "low" ? 6 : 4, h);                      // trunk
      g.beginPath();

const sky = new THREE.Mesh(new THREE.CylinderGeometry(30, 30, 34, 32, 1, true), new THREE.MeshBasicMaterial({ map: back, side: THREE.BackSide, fog: false }));
sky.position.y = 10; scene.add(sky);
const gTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = hex(new THREE.Color(S.leaf[2]).lerp(new THREE.Color(S.bark[1]), 0.45).getHex()); g.fillRect(0, 0, w, h);
  for (let i = 0; i < (LOOK === "low" ? 0 : 900); i++) { g.fillStyle = hex(S.leaf[i % 4]); g.globalAlpha = R(0.15, 0.5); g.beginPath(); g.ellipse(R(0, w), R(0, h), R(2, 8), R(1, 3), R(0, 3), 0, 7); g.fill(); }
});

// ---------------------------------------------------------------- bark with "baked" light: AO by height and crevice, moss on the upper sides
const barkA = new THREE.Color(S.bark[0]), barkB = new THREE.Color(S.bark[1]), mossC = new THREE.Color(S.moss);

const barkMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: S.flat });
const woodGeos = [];

// the big tree: a lumpy trunk with buttress roots
const TOP = 10.5;
{
  const g = new THREE.CylinderGeometry(0.55, 0.95, TOP, S.flat ? 9 : 22, S.flat ? 10 : 40, true);
  g.translate(0, TOP / 2, 0);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), a = Math.atan2(z, x);
    const k = 1 + 0.08 * Math.sin(a * 5 + y * 0.6) + 0.05 * Math.sin(a * 11 - y * 1.3) + 0.6 * Math.exp(-y * 1.6) * (0.5 + 0.5 * Math.cos(a * 4));

}
// branches: tapered tubes, spiralling up; sloths hang near their tips
const branches = [];
seed = 1000 + Number(qs.get("seed") || 7);   // same tree and hiding spots in every look
function tube(curve, r0, r1, segs, rad) {

// lianas: sagging vines between branches and down to the floor
for (let i = 0; i < 7; i++) {

}
// a ring of other trunks (one instanced draw)
const bgTrunks = [];
{
  const g = bake(new THREE.CylinderGeometry(0.35, 0.6, 16, S.flat ? 6 : 10, 6, true).translate(0, 8, 0), 0, 9);
  const im = new THREE.InstancedMesh(g, barkMat, 22), m = new THREE.Matrix4();
  for (let i = 0; i < 22; i++) {
    const a = (i / 22) * Math.PI * 2 + R(-0.12, 0.12), r = R(8, 15), s = R(0.7, 1.4);
    m.compose(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r), new THREE.Quaternion(), new THREE.Vector3(s, R(0.8, 1.1), s));

}
{
  // merge all wood of the hero tree into one draw
  let n = 0; for (const g of woodGeos) n += (g.index ? g.index.count : g.attributes.position.count);
  const pos = [], nor = [], col = [];
  for (const g0 of woodGeos) {
    const g = g0.index ? g0.toNonIndexed() : g0;
    pos.push(...g.attributes.position.array); nor.push(...g.attributes.normal.array); col.push(...g.attributes.color.array);

// ---------------------------------------------------------------- leaves: one instanced draw, the leaf shape is what differs per look
let leafGeo, leafM, perClump, leafScale;
if (LOOK === "moss") {

  const tex = canvasTex(256, 256, (g, w, h) => {
    g.translate(w / 2, h / 2);
    for (let k = 0; k < 9; k++) {
      g.save(); g.rotate(k * 0.7 + R(-0.2, 0.2)); g.translate(0, -R(30, 70));

}
const clumps = [];
for (const b of branches) for (let t = 0.3; t <= 1.0; t += 0.23) { const p = b.getPointAt(Math.min(t, 1)); clumps.push([p.x, p.y + 0.85, p.z, R(0.5, 0.8)]); }   // above the branch, so a clinging sloth peeks out below

// ground plants: ferns (moss), round bushes (paint) or cones (low), one draw
{
  let g, mat;

    const tex = canvasTex(256, 256, (cx, w, h) => {
      cx.translate(w / 2, h);
      for (let f = 0; f < 7; f++) { cx.save(); cx.rotate(-1.1 + f * 0.37); cx.strokeStyle = hex(S.leaf[f % 4]); cx.lineWidth = 3;
        cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(0, -220); cx.stroke(); cx.fillStyle = hex(S.leaf[(f + 1) % 4]);

    mat = leafMat({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide }, 0.03);
  } else if (LOOK === "paint") { g = new THREE.IcosahedronGeometry(0.5, 2).scale(1, 0.7, 1); mat = leafM; }

// sunbeams through the canopy (additive cards) and floating motes
if (S.rays && D.fx) {
  const tex = canvasTex(64, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, w, 0); gr.addColorStop(0, "rgba(255,240,200,0)"); gr.addColorStop(0.5, "rgba(255,240,200,1)"); gr.addColorStop(1, "rgba(255,240,200,0)"); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const v = g.createLinearGradient(0, 0, 0, h); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(0.2, "rgba(0,0,0,1)"); v.addColorStop(1, "rgba(0,0,0,0)"); g.globalCompositeOperation = "destination-in"; g.fillStyle = v; g.fillRect(0, 0, w, h); });

  for (let i = 0; i < 6; i++) { const r = new THREE.Mesh(new THREE.PlaneGeometry(R(1, 2.2), 16), mat); const a = R(0, 6.28), d = R(2, 7); r.position.set(Math.cos(a) * d, 6, Math.sin(a) * d); r.rotation.set(0, R(0, 6.28), 0.35); scene.add(r); }
}
let motes;
const nMotes = Math.round(S.motes * D.fx);
if (nMotes) {
  const p = new Float32Array(nMotes * 3); for (let i = 0; i < nMotes; i++) p.set([R(-8, 8), R(0.5, 10), R(-8, 8)], i * 3);

// ---------------------------------------------------------------- sloths, moss-tinted, clinging under branches
async function glb(url) {
  const txt = (await (await fetch(url)).text()).trim(), bin = Uint8Array.from(atob(txt), (c) => c.charCodeAt(0));
  return new Promise((ok, err) => new GLTFLoader().parse(bin.buffer, "", ok, err));
}
const SLOTH = await glb("models/sloth.txt");
const SL = 2.6, BR = { y: 0.10 * SL, z: 0.10 * SL }, HIDE = 5;
const sloths = [], hit = [];
seed = 2000 + Number(qs.get("seed") || 7);
const spots = [...branches.keys()].sort(() => rnd() - 0.5).slice(0, HIDE);
let tinted = false;
for (const bi of spots) {
  const o = clone(SLOTH.scene); o.scale.setScalar(SL);
  o.traverse((m) => { if (m.isMesh) m.frustumCulled = false; });
  furify(o, { shells: D.shells });
  if (!tinted) { o.traverse((m) => m.isMesh && m.material.color?.setHex(S.slothTint)); tinted = true; }   // algae in the fur: shared by all sloths
  const mixer = new THREE.AnimationMixer(o), act = mixer.clipAction(SLOTH.animations.find((a) => a.name === "cling"));
  act.play(); act.time = R(0, 4); act.timeScale = 0.6;
  const curve = branches[bi], t = R(0.55, 0.8), p = curve.getPointAt(t), tan = curve.getTangentAt(t);
  if (rnd() < 0.5) tan.negate();
  const yl = tan.clone().setY(tan.y * 0.5).normalize(), zl = new THREE.Vector3(0, -1, 0).addScaledVector(yl, yl.y).normalize(), xl = new THREE.Vector3().crossVectors(yl, zl);
  const rot = new THREE.Matrix4().makeBasis(xl, yl, zl);
  o.quaternion.setFromRotationMatrix(rot);
  o.position.copy(p).sub(new THREE.Vector3(0, BR.z, -BR.y).applyMatrix4(rot));
  scene.add(o);
  const box = new THREE.Mesh(new THREE.SphereGeometry(0.45), new THREE.MeshBasicMaterial({ visible: false }));
  box.position.copy(p).add(new THREE.Vector3(0, -0.25, 0)); scene.add(box);
  const s = { o, mixer, box, found: false, pop: 0, p }; box.userData.s = s; sloths.push(s); hit.push(box);
}

// little sprites: hearts when found, zzz for hints
const sprite = (txt) => {
  const t = canvasTex(128, 128, (g) => { g.font = "96px serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(txt, 64, 70); });
  return new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true }));
};
const fx = [];
function burst(p, txt, n, life) { for (let i = 0; i < n; i++) { const s = sprite(txt); s.scale.setScalar(0.35); s.position.copy(p); scene.add(s); fx.push({ s, v: new THREE.Vector3(R(-0.6, 0.6), R(0.8, 1.6), R(-0.6, 0.6)), t: 0, life }); } }

// ---------------------------------------------------------------- camera: orbit the big tree with one thumb
const cam = { th: 0.6, y: 5, d: 10 };
const ptrs = new Map(); let pinch0 = 0, d0 = 0, moved = 0;
addEventListener("pointerdown", (e) => { if (e.target.closest(".bar")) return; ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); d0 = cam.d; } });
addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return; const [px, py] = ptrs.get(e.pointerId), dx = e.clientX - px, dy = e.clientY - py; ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  moved += Math.abs(dx) + Math.abs(dy);
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; cam.d = THREE.MathUtils.clamp(d0 * pinch0 / Math.max(1, Math.hypot(a[0] - b[0], a[1] - b[1])), 6, 13); return; }
  cam.th -= dx * 0.008; cam.y = THREE.MathUtils.clamp(cam.y + dy * 0.02, 1.2, 10.5);
});
const up = (e) => {
  if (ptrs.has(e.pointerId) && ptrs.size === 1 && moved < 8) tap(e.clientX, e.clientY);
  ptrs.delete(e.pointerId);
};
addEventListener("pointerup", up); addEventListener("pointercancel", (e) => ptrs.delete(e.pointerId));
addEventListener("wheel", (e) => { cam.d = THREE.MathUtils.clamp(cam.d * (1 + e.deltaY * 0.001), 6, 13); }, { passive: true });
const ray = new THREE.Raycaster();
let found = 0;
function tap(x, y) {
  ray.setFromCamera(new THREE.Vector2((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1), camera);
  const h = ray.intersectObjects(hit)[0]; if (!h) return;
  const s = h.object.userData.s; if (s.found) return;
  s.found = true; s.pop = 1; found++; burst(s.p, "💗", 8, 1.4);
  $("score").textContent = `🦥 ${found} / ${HIDE}`;
  $("toast").textContent = found === HIDE ? "All found! 🎉" : "Found one! 💗"; $("toast").classList.add("show"); setTimeout(() => $("toast").classList.remove("show"), 1100);
}
$("hint").onclick = () => { const s = sloths.find((s) => !s.found); if (s) burst(s.p.clone().add(new THREE.Vector3(0, 0.2, 0)), "💤", 3, 2.4); };

// ---------------------------------------------------------------- loop, with an fps panel and a resolution safety net
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 0.8 ? 62 : 50; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
if (qs.has("cam")) Object.assign(cam, JSON.parse(qs.get("cam")));
const clock = new THREE.Clock(); let frames = 0, acc = 0, slow = 0;
window.__stats = {};
renderer.setAnimationLoop(() => {
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05); uTime.value += dt;
  camera.position.set(Math.sin(cam.th) * cam.d, cam.y + 0.8, Math.cos(cam.th) * cam.d); camera.lookAt(0, cam.y, 0);
  for (const s of sloths) {
    s.mixer.update(dt);
    if (s.pop > 0) { s.pop = Math.max(0, s.pop - dt * 1.6); s.o.scale.setScalar(SL * (1 + 0.25 * Math.sin(s.pop * Math.PI * 3) * s.pop)); }
  }
  for (let i = fx.length - 1; i >= 0; i--) { const f = fx[i]; f.t += dt; f.s.position.addScaledVector(f.v, dt); f.v.multiplyScalar(0.97); f.s.material.opacity = 1 - f.t / f.life; if (f.t > f.life) { scene.remove(f.s); fx.splice(i, 1); } }
  if (motes) motes.rotation.y += dt * 0.02;
  renderer.render(scene, camera);
  frames++; acc += raw;
  if (acc >= 1) {
    const fps = frames / acc, i = renderer.info.render;
    slow = fps < 45 ? slow + 1 : 0;
    if (slow >= 2 && pr > 1) { pr = Math.max(1, pr - 0.25); renderer.setPixelRatio(pr); resize(); slow = 0; }
    Object.assign(window.__stats, { fps: Math.round(fps), calls: i.calls, tris: i.triangles, pr, detail: DETAIL });
    $("perf").innerHTML = `${Math.round(fps)} fps<br>${i.calls} draws · ${(i.triangles / 1000).toFixed(0)}k tris`;
    frames = 0; acc = 0;
  }
});
window.__S = sloths; window.__THREE = THREE;
window.__sloths = sloths.map((s) => s.p.toArray().map((v) => +v.toFixed(2)));
window.__ready = true;
