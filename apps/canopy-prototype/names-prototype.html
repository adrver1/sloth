<!-- PROTOTYPE (throwaway): the seven camp sloths side by side, each with its name and one trait, to check the traits read on a phone. -->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camp Sloth Names</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
html,body{margin:0;height:100%;background:#cfe3c0;font-family:Fredoka,system-ui,sans-serif;color:#4a3426;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
.lab{position:fixed;transform:translate(-50%,0);text-align:center;font-weight:600;font-size:15px;line-height:1.15;background:rgb(255 248 238/.9);border-radius:12px;padding:4px 8px;white-space:nowrap;box-shadow:0 2px 0 rgb(138 90 59/.2)}

</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script type="module">

const txt = (await (await fetch("models/sloth.txt")).text()).trim(), bin = Uint8Array.from(atob(txt), c => c.charCodeAt(0));

const lam = (c) => new THREE.MeshLambertMaterial({ color: c });
// each sloth: name, trait, favourite, and how to dress it (accessories hang off the head bone)

const texMat = (t, o = {}) => new THREE.MeshLambertMaterial({ map: t, alphaTest: 0.5, side: THREE.DoubleSide, ...o });

const CAST = [
  { name: "Hibi", trait: "flower by the ear", fav: "🌺 hibiscus", dress(h) { const f = hibiscus(0.016); f.position.set(0.066, 0.108, -0.006); f.rotation.set(0.2, 0, -1.1); h.add(f); } },
  { name: "Mango", trait: "orange bandana", fav: "🥭 mango", dress(h) {
    const t = tex(128, 64, (g, w, hh) => { g.fillStyle = "#ff8a1f"; g.fillRect(0, 0, w, hh); g.fillStyle = "#fff4dc"; for (let y = 4; y < hh; y += 12) for (let x = (y % 24 ? 0 : 6); x < w; x += 12) { g.beginPath(); g.arc(x, y, 2.2, 0, 7); g.fill(); } });

  { name: "Figgy", trait: "leaf hat", fav: "🟣 fig", dress(h) {
    const C = new THREE.Vector3(0, 0.066, -0.02), RR = 0.088;
    const g = bentPlane(0.12, 0.2, 8, 14, (p, i) => { const u = p.getX(i) + 0.02, v = p.getY(i), r = Math.hypot(u, v) || 1e-6, a = r / RR;
      p.setXYZ(i, C.x + RR * Math.sin(a) * v / r, C.y + RR * Math.cos(a) * 0.95, C.z + RR * Math.sin(a) * -u / r); });
    const leaf = new THREE.Mesh(g, texMat(leafTex("#4caf3c", "#2f7a26"))); const hat = new THREE.Group(); hat.add(leaf); hat.rotation.set(-0.12, 0.9, 0.3); hat.position.set(0, 0.005, 0); h.add(hat);
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.005, 0.03, 5), lam(0x5a3f22)); stem.position.set(0, RR * 0.95 + C.y + 0.012, C.z + 0.01); stem.rotation.x = 0.4; hat.add(stem); } },
  { name: "Bandit", trait: "banana-leaf cape", fav: "🍌 banana", dress(h, o) {
    const b = h.parent, hp = h.position;
    const g = bentPlane(0.15, 0.13, 8, 8, (p, i) => { const x = p.getX(i), y = p.getY(i), a = y / 0.09; p.setXYZ(i, Math.sin(a) * 0.095 * (1 + 0.6 * (0.065 - x)), x - 0.065, Math.cos(a) * 0.085 * (1 + 1.2 * (0.065 - x)) - 0.018); });
    const t = tex(128, 128, (g, w, hh) => { g.fillStyle = "#7cc44a"; g.fillRect(14, 0, w - 14, hh); g.strokeStyle = "#4f8f2c"; g.lineWidth = 4; g.beginPath(); g.moveTo(14, hh / 2); g.lineTo(w, hh / 2); g.stroke(); g.lineWidth = 1.6;
      for (let y = -hh; y < hh * 2; y += 7) { g.beginPath(); g.moveTo(w, y); g.lineTo(14, y + (y < hh / 2 ? -50 : 50) * 0); g.stroke(); }
      g.fillStyle = "#7cc44a"; for (let y = 0; y < hh; y += 16) { g.beginPath(); g.moveTo(14, y); g.lineTo(0, y + 5); g.lineTo(14, y + 12); g.fill(); } }), cape = new THREE.Mesh(g, texMat(t)); cape.position.copy(hp).add(new THREE.Vector3(0, 0.012, 0.0)); b.add(cape);
    const tie = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.01, 6, 18), lam(0x3f7f24)); tie.rotation.x = Math.PI / 2; tie.scale.set(1, 0.85, 1); tie.position.copy(hp).add(new THREE.Vector3(0, 0.012, 0)); b.add(tie);
    const k = new THREE.Mesh(new THREE.SphereGeometry(0.016, 8, 6), lam(0x3f7f24)); k.position.copy(hp).add(new THREE.Vector3(0, 0.006, -0.052)); b.add(k); } },
  { name: "Pip", trait: "the smallest", fav: "🌺 hibiscus", scale: 0.72 },
  { name: "Hazel", trait: "blue bow", fav: "🟣 fig", dress(h) { const m = lam(0x5aa7e8), bow = new THREE.Group();
    for (const sg of [-1, 1]) { const l = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.04, 8).scale(1, 1, 0.45), m); l.rotation.z = sg * Math.PI / 2; l.position.x = sg * 0.019; bow.add(l); }
    bow.add(new THREE.Mesh(new THREE.SphereGeometry(0.009, 8, 6), m)); bow.position.set(-0.04, 0.128, -0.01); bow.rotation.set(0.1, 0.2, 0.5); h.add(bow); } },
  { name: "Sunny", trait: "yellow scarf", fav: "🥭 mango", dress(h) { const m = lam(0xffcf33);
    const s = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.017, 8, 24), m); s.rotation.x = Math.PI / 2; s.scale.set(1.08, 0.9, 1); s.position.set(0, 0.012, -0.006); h.add(s);
    const t = new THREE.Mesh(new THREE.BoxGeometry(0.026, 0.06, 0.01), m); t.position.set(0.024, -0.02, -0.058); t.rotation.set(0.25, 0, 0.18); h.add(t);
    const t2 = t.clone(); t2.position.set(0.04, -0.012, -0.05); t2.rotation.set(0.25, 0, 0.45); t2.scale.y = 0.8; h.add(t2); } },
];
const Q = new URLSearchParams(location.search), TURN = +(Q.get("turn") || 0), NEAR = Q.has("near");
const SL = 2.4, GAP = 0.62, items = [];
CAST.forEach((c, i) => {
  const o = clone(G.scene); o.traverse(m => { if (m.isMesh) { m.frustumCulled = false; m.material = m.material.clone(); if (c.tint) m.material.color.setHex(c.tint); } });
  furify(o, { shells: 4 }); o.scale.setScalar(SL * (c.scale || 1)); o.rotation.y = Math.PI;
  const mx = new THREE.AnimationMixer(o); mx.clipAction(G.animations.find(a => a.name === "idle")).play(); mx.setTime(i * 0.7);

});
function resize() { const w = innerWidth, h = innerHeight, a = w / h; renderer.setSize(w, h, false); cam.aspect = a;

    it.o.position.set((k - (n - 1) / 2) * GAP, 0, back ? -2.4 : 0); it.o.rotation.y = Math.PI + TURN + (k - (n - 1) / 2) * 0.06; }
  cam.fov = ph ? 44 : 30; if (ph) { cam.position.set(0, 3.4, 5.6); cam.lookAt(0, 0.2, -1.1); } else { cam.position.set(0, 0.85, NEAR ? 3.0 : 5.2); cam.lookAt(0, 0.3, 0); } cam.updateProjectionMatrix(); }

const v = new THREE.Vector3(), clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const dt = clock.getDelta(); for (const it of items) { it.mx.update(dt); v.copy(it.o.position); v.y = -0.02; v.project(cam);
  it.el.style.left = ((v.x + 1) / 2 * innerWidth) + "px"; it.el.style.top = ((1 - v.y) / 2 * innerHeight + 6) + "px"; }
  renderer.render(scene, cam); window.__ready = true; });
window.__G = G; window.__THREE = THREE;
</script>
