<script type="module">
// Summit Cabin: a walkable test of long views, inspired by how The Long Dark keeps near and far as one world.
//  - Distance haze (aerial perspective) instead of fog: far things shift to the sky's colour but never vanish. It is height
//    based and glows toward the sun. Weather fog and a valley fog layer are separate and come and go.
//  - Terrain is ten square rings round the player, each twice as coarse as the one inside it, 2 m cells at your feet and 1 km
//    cells at 16 km, so near ground is detailed and the whole range costs about 15k triangles.
//  - One fixed tree layout drawn three ways by distance: full trees near (spruce, pine, birch, snag), cards that face you further out, colour beyond.
//  - Places to walk to: the cabin, a fishing hut on a frozen lake, a fire lookout on its hill, with marked trails.
//  - A painted horizon of far mountains on a ring at 22 km. Real-time shadows only round the player.
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = (id) => document.getElementById(id);
const isPhone = matchMedia('(max-width: 700px), (pointer: coarse)').matches;
const TRIS = [];

// ---------------------------------------------------------------- random and noise
function mulberry(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const hash = (x, y) => { let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }

function ridged(x, y, o) { let s = 0, a = 0.5, f = 1, n = 0, w = 1; for (let i = 0; i < o; i++) { let r = 1 - Math.abs(vnoise(x * f + i * 31.7, y * f + i * 5.3) * 2 - 1); r *= r * w; w = Math.min(1, r * 1.6); s += a * r; n += a; a *= 0.5; f *= 2.1; } return s / n; }
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ---------------------------------------------------------------- the land
// a steep peak with the cabin on a flat top and a cliff south of the porch; forested hills and valleys round it; a frozen
// lake with a fishing hut 950 m north-west, a fire lookout on its own hill 1 km north-east, and high ranges from 4 km out.
// Everything you see is the same ground, so you can walk to it.
const LAKE_P = { x: -760, z: 560, r: 170 }, HILL_P = { x: 820, z: 620 };
function hBase(x, z) {
  const r = Math.hypot(x, z), e = Math.hypot(x / 1.25, z);

  h += (fbm(x / 1500, z / 1500, 5) - 0.45) * 420;
  h += (fbm(x / 240, z / 240, 3) - 0.5) * 36 * Math.min(1, r / 400);
  h += 150 * Math.exp(-((x - HILL_P.x) ** 2 + (z - HILL_P.z) ** 2) / 230 ** 2);   // the lookout's hill
  h += sstep(4000, 9500, r) * (ridged(x / 3400 + 7, z / 3400 - 3, 5) * 1900 - 250);
  return h;
}
const TOP = hBase(0, 0) + 2;
let LAKE = 0;   // the lowest valley floors freeze into flat lakes; set from the height spread
{ const hs = []; for (let i = 0; i < 4000; i++) { const a = R(0, 6.283), r = R(1500, 7000); hs.push(hBase(Math.cos(a) * r, Math.sin(a) * r)); } hs.sort((a, b) => a - b); LAKE = hs[Math.floor(hs.length * 0.07)]; }
const LAKE_H = hBase(LAKE_P.x, LAKE_P.z) - 30;
// the cabin sits on a flat top; just south of the porch the summit breaks off in a cliff, so the porch looks down over the valleys

const TREELINE = LAKE + 520;
// the lookout stands on the top of its hill; the fishing hut out on the ice, 45 m from the shore nearest the cabin
const TOWER = (() => { let best = [0, 0, -1e9]; for (let i = -15; i <= 15; i++) for (let j = -15; j <= 15; j++) { const x = HILL_P.x + i * 10, z = HILL_P.z + j * 10, h = height(x, z); if (h > best[2]) best = [x, z, h]; } return { x: best[0], z: best[1], y: best[2] }; })();

// two marked trails from the cabin: one down to the lake, one over to the lookout
const TRAILS = [
  [[-7, 7], [-45, 60], [-150, 170], [-300, 290], [-450, 380], [SHORE.x, SHORE.z], [HUT.x, HUT.z]],
  [[8, 8], [70, 80], [220, 210], [400, 350], [580, 480], [TOWER.x - 10, TOWER.z - 8]],
];

  if (onIce(x, z, h)) return 0;
  return sstep(0.38, 0.47, fbm(x / 650 + 3, z / 650 - 7, 3)) * (1 - sstep(TREELINE - 50, TREELINE, h)) * (1 - sstep(0.28, 0.42, s));

// ---------------------------------------------------------------- renderer, scene, camera
const renderer = new THREE.WebGLRenderer({ antialias: !isPhone, logarithmicDepthBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isPhone ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
$('stage').appendChild(renderer.domElement);

scene.fog = new THREE.Fog(0xffffff, 1, 2);   // switches the fog chunk on; the chunk itself is ours (below)
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.3, 40000);

// ---------------------------------------------------------------- haze and fog: one shader chunk for every material
// optical depth of a fog whose density falls off with height (density c at height h0, scale 1/b), along a ray of length t
const U = {
  uHor: { value: new THREE.Color() }, uSunCol: { value: new THREE.Color() }, uSunDir: { value: new THREE.Vector3(0, 1, 0) },
  uHaze: { value: 0.7e-4 }, uMist: { value: 0 }, uMistTop: { value: 130 }, uMistCol: { value: new THREE.Color() },
  uFogDen: { value: 0 }, uFogCol: { value: new THREE.Color() },

THREE.ShaderChunk.fog_pars_vertex = '#ifdef USE_FOG\nvarying vec3 vFogW;\n#endif';
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
  vec4 fogW = vec4(transformed, 1.0);
  #ifdef USE_INSTANCING
    fogW = instanceMatrix * fogW;
  #endif

#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
varying vec3 vFogW;
uniform vec3 uHor, uSunCol, uSunDir, uMistCol, uFogCol; uniform float uHaze, uMist, uMistTop, uFogDen;
#ifndef HAZE_MUL
#define HAZE_MUL 1.0
#endif
float hfog(float c, float b, float h0, vec3 ro, vec3 rd, float t) { float k = rd.y * b; float e = abs(k) < 1e-6 ? t : (1.0 - exp(-t * k)) / k; return c * exp(-(ro.y - h0) * b) * e; }
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
  vec3 fv = vFogW - cameraPosition; float ft = length(fv); vec3 frd = fv / ft; float fs = max(dot(frd, uSunDir), 0.0);
  vec3 hazeC = uHor + uSunCol * (pow(fs, 6.0) * 0.35);
  gl_FragColor.rgb = mix(gl_FragColor.rgb, linearToOutputTexel(vec4(hazeC, 1.0)).rgb, 1.0 - exp(-hfog(uHaze, 1.0 / 1600.0, 0.0, cameraPosition, frd, ft) * HAZE_MUL));
  vec3 mistC = uMistCol + uSunCol * (pow(fs, 4.0) * 0.25);
  gl_FragColor.rgb = mix(gl_FragColor.rgb, linearToOutputTexel(vec4(mistC, 1.0)).rgb, 1.0 - exp(-hfog(uMist, 1.0 / 45.0, uMistTop, cameraPosition, frd, ft)));

const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 16), new THREE.ShaderMaterial({
  uniforms: { uZen: { value: new THREE.Color() }, uHor: U.uHor, uSunCol: U.uSunCol, uSunDir: U.uSunDir, uMoonDir: { value: new THREE.Vector3() }, uNight: { value: 0 }, uFog: { value: 0 }, uFogCol: U.uFogCol },

  fragmentShader: `uniform vec3 uZen, uHor, uSunCol, uSunDir, uMoonDir, uFogCol; uniform float uNight, uFog; varying vec3 vDir;
  void main(){ vec3 d = normalize(vDir); float y = max(d.y, 0.0); vec3 c = mix(uHor, uZen, pow(y, 0.5));
    float s = max(dot(d, uSunDir), 0.0); c += uSunCol * (pow(s, 6.0) * 0.35 + pow(s, 90.0) * 0.8 + smoothstep(0.9994, 0.9997, s) * 6.0);

// ---------------------------------------------------------------- terrain: square rings round the player, each twice as coarse
// Ten rings of 40 × 40 cells: 2 m cells round your feet, 1 km cells at 20 km. Each ring snaps to its own grid as you walk.
// Geomorphing hides the joins: every vertex also stores the height, normal and colour the next coarser ring would give it, and

const snowC = new THREE.Color('#f3f7fc'), rockC = new THREE.Color('#40454c'), shadeC = new THREE.Color('#8e9db0'), iceC = new THREE.Color('#cbdde9'), trailC = new THREE.Color('#d5dce6'), tmpC = new THREE.Color();

  for (let i = 0; i < 300; i++) { g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(r() * w, r() * h, 1, 1); } }, true);
// Far forest: the ground takes the colour the tree cards would give it there. How much of the ground the trees hide depends on
// how flat you look across it (cotangent of the view angle): looking down from the summit you see snow between the trees, looking
// across a far slope you see a wall of trees. uTreeCol and uTreeK (cover per unit cotangent) are measured from the card itself.
const uTreeCol = { value: new THREE.Color('#33463c') }, uTreeK = { value: 0.2 }, NEAR = isPhone ? 130 : 170, CARD_R = isPhone ? 1300 : 1600, uCardR = { value: CARD_R };

  sh.uniforms.uHalf = half; sh.uniforms.uTreeCol = uTreeCol; sh.uniforms.uTreeK = uTreeK; sh.uniforms.uCardR = uCardR;
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nattribute float hc; attribute vec3 nc; attribute vec3 cc; attribute float fm; uniform float uHalf, uTreeK, uCardR; varying float vForest;')
    .replace('#include <color_vertex>', `vec2 mq = abs(position.xz - cameraPosition.xz); float mph = clamp((max(mq.x, mq.y) - 0.55 * uHalf) / (0.3 * uHalf), 0.0, 1.0);
      vColor = vec4(mix(color.rgb, cc, mph), 1.0);
      vec3 vd = cameraPosition - position; float fd = length(vd.xz); vd = normalize(vd);
      float cover = 1.0 - exp(-uTreeK * fm * length(vd.xz) / max(dot(vd, normalize(mix(normal, nc, mph))), 0.04));
      vForest = cover * smoothstep(0.8 * uCardR, uCardR, fd);`)   // only where the cards fade out (placeThings)

    .replace('#include <begin_vertex>', 'vec3 transformed = vec3(position.x, mix(position.y, hc, mph), position.z);');
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform vec3 uTreeCol; varying float vForest;')
    .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb = mix(diffuseColor.rgb, uTreeCol, vForest);');
};

      if (y < -20) y += 50; if (x > 40) x -= 80; if (x < -40) x += 80; if (z > 40) z -= 80; if (z < -40) z += 80; p.set([x, y, z], i * 3); }
