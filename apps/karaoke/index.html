function buildSlow() {

const HEAD_DROP = [0.09, 0.06];   // world metres down and toward the camera, for the hanging sloth's head

    const ref = s1.B("head").getWorldQuaternion(new THREE.Quaternion()).premultiply(s1.g.quaternion.clone().invert());

// ---------------------------------------------------------------- camera and resize
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const portrait = w / h < 0.8;
  camera.fov = portrait ? 44 : 38; camera.userData.z = portrait ? -6.9 : -4.7; camera.userData.ty = portrait ? 1.15 : 1.05; camera.userData.y = portrait ? 1.3 : 1.25;

document.querySelectorAll(".pick").forEach((b) => (b.onclick = () => useSong(b.dataset.song)));

  if (SONG_ID === "aussie") { const c = crowd[Math.floor(Math.random() * crowd.length)]; if (c.hop === 0) c.vy = 1.5; puff("heart", c.g.position.clone().add(new THREE.Vector3(0, 0.45, 0)), 4, 0.3); }
  const pool = SONG_ID === "party" ? Object.values(BAND) : [s1, s2], s = pool[Math.floor(Math.random() * pool.length)];

$("loadmsg").textContent = "Sing along, or switch the guide tune off and sing it yourself. Tap the stage to cheer.";

// ---------------------------------------------------------------- the loop
const clock = new THREE.Timer();
let lastBeatInt = -1, lastLine = -1;
const restQ = new Map();

  if (playing && b >= SONG_END) {
    playing = false; ended = true; $("end").hidden = false; $("pause").hidden = true;
    for (const s of SONG_ID === "party" ? Object.values(BAND) : [s1, s2]) s.vy = 2.2;
    if (SONG_ID === "aussie") crowd.forEach((c) => (c.vy = 2.0));
    puff("heart", new THREE.Vector3(0, 2.0, -0.2), 14, 1.6);
  }

frame();
window.__ready = true;
window.__dbg = { lines, SONG_END, start, sloths, her, THREE };
