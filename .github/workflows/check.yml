# Static checks for Canopy Camp and its generators (review R2-004), on every pull request that touches them, and before every
# deploy (pages.yml calls this workflow and deploys only when it passes). npm run check runs, with no browser and no Blender:
#   tools/check-imports.cjs   every camp module parses, every named import matches an export, every models/ path written as a
#                             plain string exists, and no KTX2 light map is older than its PNG
#   tools/check-python.py     every Python file in props/, characters/ and stickers/renderer/ compiles
#   tools/sync-shared.cjs --check   the fur.js copies match shared/fur.js
# The headless page check (npm run probe, tools/camp-probe.cjs --strict) is not run here yet: it needs a browser and takes
# about half a minute under SwiftShader. Run it by hand before a merge.
name: Check

on:
  pull_request:
    paths:
      - apps/canopy-prototype/**
      - shared/**
      - props/**
      - characters/**
      - stickers/renderer/**
      - tools/**
      - package.json
      - package-lock.json
      - .github/workflows/check.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # no submodules: nothing checked here uses engine/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run check
